[project]
name = "acme-invoice-agent"
version = "0.1.0"
description = "Multi-agent invoice processing pipeline: ingestion, validation, approval, payment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
